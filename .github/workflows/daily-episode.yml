# Free daily automation on GitHub Actions (free for public repos; ~2000 min/month on private).
# Makes the Hindi episode with Gemini (free tier, best Hindi) + Piper voice + puppet anchor, uploads it to YouTube
# as PRIVATE so a human reviews it in YouTube Studio before publishing.
#
# Repo secrets needed:  GEMINI_API_KEY, YT_CLIENT_SECRET (client_secret.json contents),
#                       YT_TOKEN (token.json contents, created by `python run.py auth` on your PC)
name: daily-episode

on:
  schedule:
    - cron: "37 1 * * *"   # 07:07 IST every day
  workflow_dispatch:

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_YT: ${{ secrets.YT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: piper-voices-v1
      - name: Use Gemini on the runner
        run: |
          sed -i 's/provider: "ollama"/provider: "gemini"/' config.yaml
      - name: Make episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py all
      - name: Upload to YouTube (private)
        if: env.HAS_YT == 'true'
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          echo "$YT_TOKEN" > token.json
          echo "$YT_CLIENT_SECRET" > client_secret.json
          python run.py upload
      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            output/*/episode.mp4
            output/*/thumbnail.jpg
            output/*/script.json
            output/*/youtube_*.txt
          retention-days: 7
