# Free daily automation on GitHub Actions.
# Makes the Hindi bulletin + one Short per story, with Gemini (free tier) writing and a small Ollama model
# on the runner as backup, then uploads everything to YouTube (privacy is set in config.yaml).
#
# Repo secrets needed:  GEMINI_API_KEY
#                       YT_TOKEN (optional) = {"client_id": ..., "client_secret": ..., "refresh_token": ...,
#                                              "token_uri": "https://oauth2.googleapis.com/token"}
#                       (see README "YouTube"; without it the videos are only saved as a run artifact)
name: daily-episode

on:
  # Runs just after YouTube's daily upload quota resets (midnight US Pacific = 12:30/13:30 IST), so a late
  # start can never collide with the next day's run. Backups skip themselves if today's episode exists.
  schedule:
    - cron: "37 8 * * *"   # 14:07 IST
    - cron: "37 9 * * *"   # 15:07 IST (backup)
    - cron: "37 10 * * *"  # 16:07 IST (backup)
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true
      guard:
        description: "Skip if today's episode already exists (for timed triggers)"
        type: boolean
        default: false
      llm:
        description: "Writer (test the backup with ollama)"
        type: choice
        options: [gemini, ollama]
        default: gemini

permissions:
  actions: read     # to see whether today's episode was already made
  contents: read

concurrency: daily-episode   # backups wait for a running episode instead of starting a second one

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a manual run always goes ahead; scheduled/guarded ones skip if today's episode already exists
          N=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=script-$(date -u +%F)" --jq '.total_count')
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.guard }}" = "true" ]; } && [ "${N:-0}" -gt 0 ]; then
            echo "Today's episode already exists; skipping."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

  episode:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150   # leaves room for the slow CPU backup model if Gemini is out of quota
    env:
      HAS_YT: ${{ secrets.YT_TOKEN != '' }}
      OLLAMA_MODELS: /home/runner/ollama-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: models
          key: piper-voices-v1

      # --- backup LLM: small Ollama model on the runner's CPU ---
      - uses: actions/cache@v4
        with:
          path: /home/runner/ollama-models
          key: ollama-gemma3-4b-v1
      - name: Start backup LLM (Ollama)
        continue-on-error: true   # if this fails, the run still works with Gemini alone
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull "$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['llm']['fallback_ollama_model'])")"

      - name: Choose the writer (Gemini by default)
        run: |
          sed -i "s/^  provider: \"ollama\"/  provider: \"${{ inputs.llm || 'gemini' }}\"/" config.yaml
          sed -i 's/^  ollama_model: .*/  ollama_model: "gemma3:4b"/' config.yaml
          grep -n 'provider:' config.yaml
      - name: Make bulletin + Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py all
          echo "EPISODE_DATE=$(ls output | sort | tail -1)" >> "$GITHUB_ENV"
      - name: Upload to YouTube
        if: env.HAS_YT == 'true' && (github.event_name == 'schedule' || inputs.upload)
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          echo "$YT_TOKEN" > token.json
          python run.py upload
      - uses: actions/upload-artifact@v4
        with:
          name: episode
          path: |
            output/*/episode.mp4
            output/*/shorts/*.mp4
            output/*/thumbnail.jpg
            output/*/script.json
            output/*/youtube_*.txt
          retention-days: 7
      - name: Keep the script for Sunday's weekly review
        uses: actions/upload-artifact@v4
        with:
          name: script-${{ env.EPISODE_DATE }}
          path: output/${{ env.EPISODE_DATE }}/script.json
          retention-days: 14
