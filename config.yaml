# ---------------------------------------------------------------
#  Neutral Desk - configuration
#  Everything here is free. Edit and re-run.
# ---------------------------------------------------------------

channel:
  name: "Zero Masala"                # shown on screen
  spoken_name: "ज़ीरो मसाला"          # how the anchor says it (write in the episode's language)
  tagline: "खबर, बिना मसाला"
  language: "hi"                     # hi = Hindi, en = English

# How stories are chosen and checked
editor:
  hours_back: 30            # only use articles newer than this
  india_stories: 5          # Indian stories per episode
  world_stories: 1          # world stories per episode
  min_outlets: 3            # a story needs this many INDEPENDENT media groups (same owner = 1)
  world_min_countries: 2    # world stories must also be covered from this many countries
  confirm_threshold: 3      # a fact is "confirmed" only if this many independent groups state it
  fetch_full_text: true     # download article text (better facts, slower)
  max_articles_per_story: 8
  cluster_distance: 0.85    # lower = stricter grouping of articles into one story

# Free LLM. provider: ollama (local, unlimited) | gemini (free API key) | none (English only, no AI)
# For Hindi, Gemini or a Gemma model writes the best Hindi.
llm:
  provider: "ollama"
  ollama_host: "http://localhost:11434"
  ollama_model: "gemma3:12b"        # needs ~16 GB RAM; weak PC: gemma3:4b
  gemini_model: "gemini-flash-latest"  # always the newest free Flash model; key from env GEMINI_API_KEY (aistudio.google.com, free)
  gemini_fallback_models: ["gemini-flash-lite-latest"]  # used if the main model is overloaded/retired
  gemini_min_interval: 6            # seconds between calls (free-tier rate limit)
  temperature: 0.2

# Free offline voice (Piper). Hindi voices: hi_IN-rohan-medium (male), hi_IN-pratham-medium (male),
# hi_IN-priyamvada-medium (female). English: en/en_US/ryan/medium/en_US-ryan-medium
tts:
  voice: "hi/hi_IN/rohan/medium/hi_IN-rohan-medium"
  length_scale: 0.8          # speed: 0.8 = 1.25x faster, 1.0 = normal, >1 slower
  pause_after_segment: 0.6   # seconds

# Anchor: "puppet" = built-in animated anchor (CPU, no setup)
#         "lipsync" = realistic face from Colab (see colab/lipsync.ipynb)
anchor:
  mode: "puppet"
  face_image: "assets/anchor_face.png"   # used only for lipsync mode

video:
  width: 1280
  height: 720
  fps: 25

youtube:
  privacy: "private"         # upload private -> review in YouTube Studio -> publish
  category_id: "25"          # News & Politics
  tags: ["hindi news", "हिंदी समाचार", "आज की ताजा खबर", "india news", "unbiased news", "fact check"]

# News sources.
#   owner:   media group. Outlets with the same owner count as ONE source (they aren't independent).
